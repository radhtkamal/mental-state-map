<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background - very light pink with red border -->
  <rect x="16" y="16" width="224" height="224" rx="50" fill="#fce7f3" stroke="#ef4444" stroke-width="6"/>
  
  <!-- Cloud emoji - positioned with space from border -->
  <text x="70" y="165" font-size="150" text-anchor="middle" dominant-baseline="central">☁️</text>
  
  <!-- Brain emoji - positioned with space from border -->
  <text x="190" y="135" font-size="140" text-anchor="middle" dominant-baseline="central">🧠</text>
</svg>
